[tool.uv.workspace]
members = ["forge", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["forge/tests", "pipeline/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
