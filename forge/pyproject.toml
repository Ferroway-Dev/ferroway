# Ferroway Forge — forge/pyproject.toml

[project]
name = "ferroway-forge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka",
    "asyncpg",
    "psycopg2-binary",
    "llama-index",
    "openai",
    "anthropic",
    "click",
    "typer",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "jupyter",
    "ipykernel",
    "pytest-cov",
]

[project.scripts]
ferroway = "forge.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"notebooks/**/*.py" = ["ANN", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["llama_index.*", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
